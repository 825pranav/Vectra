[project]
name = "vectra"
version = "0.1.0"
description = "A vector database built from scratch: HNSW, product quantization, filtered search, WAL durability and learned early termination, in Python + Numba."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "numba",
    "grpcio",
    "protobuf",
    "lightgbm",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
bench = ["faiss-cpu", "matplotlib"]
data = ["sentence-transformers", "torch"]   # embedding the text dataset (GPU), offline only
rest = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "grpcio-tools", "ruff"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["proto/*_pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
